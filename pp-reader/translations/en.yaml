# English translation for the PP Reader add-on's Configuration UI.
# Ref: https://developers.home-assistant.io/docs/add-ons/translations
#
# T-029 / D-006 (Antwort 19): labels the `portfolio_path` default shown in
# config.yaml clearly as an EXAMPLE, so a non-programmer sees this in the
# Supervisor's Configuration tab itself — not only in README.md.
configuration:
  portfolio_path:
    name: Portfolio file path
    description: >-
      Path to your Portfolio Performance .portfolio file inside Home
      Assistant. Must start with /share/, /config/, or /media/ and end in
      .portfolio, e.g. /share/portfolios/my_portfolio.portfolio. The value
      shown by default is only an EXAMPLE, not a real file. An invalid
      format is rejected right when you save this field; a correctly
      formatted path with no file behind it (like the unchanged example)
      instead shows a configuration error in the dashboard after starting.
      If the add-on suddenly won't start after an update even though it
      worked before, re-open and re-save this field — see the add-on's
      README for details.
